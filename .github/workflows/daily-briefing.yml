name: Daily Iran-War Briefing

on:
  schedule:
    # GitHub cron proved unreliable for this repo: fires dropped entirely (Aug 27, Aug 30)
    # and delayed 7-11 hours (Aug 28-29), including one that slipped past UTC midnight and
    # generated the next day's briefing at 00:08 UTC. Strategy: fire HOURLY and let the
    # dupcheck gate below decide. Exactly one real run per day results:
    #   - fires before 12:00 UTC skip (too early — that's the midnight-slip guard)
    #   - the first fire delivered at/after 12:53 UTC generates the briefing
    #   - every later fire skips because today's briefing exists (7-second no-op runs)
    - cron: "53 * * * *"
  workflow_dispatch:      # manual trigger; optional per-run search-provider override
    inputs:
      provider:
        description: "Search provider override: tavily or serper (blank = default)"
        required: false
        default: ""
        type: string

# Native GITHUB_TOKEN write access — no PAT, no deploy key, no plaintext secret
permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scheduled runs generate at most one briefing per day, never before 12:00 UTC.
      # (Hour gate prevents a delayed fire slipping past UTC midnight from generating the
      # next day's briefing with stale evening evidence — happened Aug 29 at 00:08 UTC.)
      # Manual dispatch always runs.
      - name: Check whether this scheduled fire should run
        id: dupcheck
        if: github.event_name == 'schedule'
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          HOUR="$(date -u +%H)"
          if [ "$HOUR" -lt 12 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Before 12:00 UTC ($HOUR:xx) — outside the briefing window, skipping."
          elif grep -q "## Daily Briefing - $TODAY" iran-war-impact-framework.md; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Briefing for $TODAY already exists — skipping duplicate run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.dupcheck.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.dupcheck.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Generate briefing
        if: steps.dupcheck.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY:     ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          SEARCH_PROVIDER:    ${{ inputs.provider || vars.SEARCH_PROVIDER || 'tavily' }}
        run: python scripts/generate_briefing.py

      - name: Commit & push
        if: steps.dupcheck.outputs.skip != 'true'
        run: |
          git config user.name  "Claude Daily Agent"
          git config user.email "agent@users.noreply.github.com"
          git add iran-war-impact-framework.md iran-war-standing.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily briefing $(date -u +%Y-%m-%d)"
          # Rebase onto anything pushed to main while this run was generating
          # (a concurrent push otherwise rejects ours and strands the briefing).
          git pull --rebase origin main
          git push
