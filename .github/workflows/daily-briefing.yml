name: Daily Iran-War Briefing

on:
  # PRIMARY trigger: an external pinger (cron-job.org) POSTs to the workflow_dispatch
  # endpoint at 11:50 UTC daily. workflow_dispatch events run immediately; only
  # GitHub's `schedule` events are throttled/dropped (degraded since Aug 27, 2026).
  workflow_dispatch:
    inputs:
      provider:
        description: "Search provider override: tavily or serper (blank = default)"
        required: false
        default: ""
        type: string
      force:
        description: "Regenerate even if today's briefing already exists"
        required: false
        default: false
        type: boolean
  # FALLBACK trigger: hourly cron. Every fire is a no-op unless it is at/after 12:00 UTC
  # AND today's briefing is still missing (i.e. the external pinger failed). GitHub
  # delivers only ~6 of these per day; each no-op costs a few seconds of runner time.
  schedule:
    - cron: "53 * * * *"

# Native GITHUB_TOKEN write access — no PAT, no deploy key, no plaintext secret
permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the CURRENT tip of main, not the SHA pinned when the event was
          # queued. A run that waited in the concurrency queue behind another run
          # otherwise sees a stale file, misses today's briefing, and regenerates it
          # (happened 2026-09-11: double generation + rebase conflict on push).
          ref: main

      # One briefing per day:
      #   - today's briefing already exists -> skip (manual dispatch with force=true overrides)
      #   - scheduled fire before 12:00 UTC -> skip (fallback only; the pinger owns 11:50)
      #   - otherwise                       -> generate
      - name: Gate
        id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          HOUR="$(date -u +%H)"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "force=true — regenerating regardless of existing briefing."
            exit 0
          fi
          if grep -q "## Daily Briefing - $TODAY" iran-war-impact-framework.md; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Briefing for $TODAY already exists — skipping."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" -lt 12 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled fallback fire before 12:00 UTC ($HOUR:xx) — skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Generate briefing
        if: steps.gate.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY:     ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          SEARCH_PROVIDER:    ${{ inputs.provider || vars.SEARCH_PROVIDER || 'tavily' }}
        run: python scripts/generate_briefing.py

      - name: Commit & push
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name  "Claude Daily Agent"
          git config user.email "agent@users.noreply.github.com"
          git add iran-war-impact-framework.md iran-war-standing.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily briefing $(date -u +%Y-%m-%d)"
          # Rebase onto anything pushed to main while this run was generating
          # (a concurrent push otherwise rejects ours and strands the briefing).
          git pull --rebase origin main
          git push
