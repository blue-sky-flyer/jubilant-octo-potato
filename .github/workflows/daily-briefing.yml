name: Daily Iran-War Briefing

on:
  # Sole trigger: an external pinger (cron-job.org) POSTs to the workflow_dispatch
  # endpoint at 11:50 UTC daily. workflow_dispatch events run immediately; GitHub's
  # own `schedule` events were throttled/dropped for this repo (Aug 27 - Sep 12, 2026)
  # and the schedule trigger was removed 2026-09-12. Manual runs from the Actions tab
  # use the same path.
  workflow_dispatch:
    inputs:
      provider:
        description: "Search provider override: tavily or serper (blank = default)"
        required: false
        default: ""
        type: string
      force:
        description: "Regenerate even if today's briefing already exists"
        required: false
        default: false
        type: boolean
# Native GITHUB_TOKEN write access — no PAT, no deploy key, no plaintext secret
permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the CURRENT tip of main, not the SHA pinned when the event was
          # queued. A run that waited in the concurrency queue behind another run
          # otherwise sees a stale file, misses today's briefing, and regenerates it
          # (happened 2026-09-11: double generation + rebase conflict on push).
          ref: main

      # One briefing per day: skip if today's already exists (force=true overrides,
      # e.g. a deliberate regen from the Actions tab or a repeat ping).
      - name: Gate
        id: gate
        env:
          FORCE: ${{ inputs.force == true }}
        run: |
          TODAY="$(date -u +%Y-%m-%d)"
          if [ "$FORCE" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "force=true — regenerating regardless of existing briefing."
            exit 0
          fi
          if grep -q "## Daily Briefing - $TODAY" iran-war-impact-framework.md; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Briefing for $TODAY already exists — skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Generate briefing
        if: steps.gate.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY:     ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          SEARCH_PROVIDER:    ${{ inputs.provider || vars.SEARCH_PROVIDER || 'tavily' }}
          FIRMS_MAP_KEY:      ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/generate_briefing.py

      - name: Commit & push
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name  "Claude Daily Agent"
          git config user.email "agent@users.noreply.github.com"
          # Health beacon for pp_ops_monitor: a fresh timestamp each successful run.
          # Since this workflow is externally triggered (no cron the monitor can read),
          # the beacon is how a dead pinger surfaces — if no run refreshes it within
          # expected_max_age_hours, the morning digest flags it stale.
          mkdir -p health
          cat > health/status.json <<JSON
          {
            "status": "ok",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "summary": "Daily Iran-War briefing for $(date -u +%Y-%m-%d) generated and committed.",
            "expected_max_age_hours": 30
          }
          JSON
          git add iran-war-impact-framework.md iran-war-standing.md iran-war-questions.md data/signals health/status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily briefing $(date -u +%Y-%m-%d)"
          # Rebase onto anything pushed to main while this run was generating
          # (a concurrent push otherwise rejects ours and strands the briefing).
          git pull --rebase origin main
          git push
