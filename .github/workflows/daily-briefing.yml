name: Daily Iran-War Briefing

on:
  schedule:
    # 12:53 UTC = 5:53am PDT (Pacific). NOTE: GitHub cron is UTC and does NOT follow DST —
    # in PST (winter) this fires at 4:53am PT; change to "53 13 * * *" to keep 5:53am year-round.
    - cron: "53 12 * * *"
    # Backup fires 3h later ONLY if the primary was dropped (GitHub cron is best-effort and
    # occasionally skips — e.g. 2026-08-27). The dupcheck step below makes this a no-op
    # whenever today's briefing already exists, so normal days still run exactly once.
    - cron: "53 15 * * *"
  workflow_dispatch:      # manual trigger; optional per-run search-provider override
    inputs:
      provider:
        description: "Search provider override: tavily or serper (blank = default)"
        required: false
        default: ""
        type: string

# Native GITHUB_TOKEN write access — no PAT, no deploy key, no plaintext secret
permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scheduled runs skip if today's briefing already exists (makes the backup cron —
      # and any GitHub double-fire — idempotent). Manual dispatch always runs.
      - name: Check for existing briefing (scheduled runs only)
        id: dupcheck
        if: github.event_name == 'schedule'
        run: |
          if grep -q "## Daily Briefing - $(date -u +%Y-%m-%d)" iran-war-impact-framework.md; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Briefing for $(date -u +%Y-%m-%d) already exists — skipping duplicate run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.dupcheck.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.dupcheck.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Generate briefing
        if: steps.dupcheck.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY:     ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          SEARCH_PROVIDER:    ${{ inputs.provider || vars.SEARCH_PROVIDER || 'tavily' }}
        run: python scripts/generate_briefing.py

      - name: Commit & push
        if: steps.dupcheck.outputs.skip != 'true'
        run: |
          git config user.name  "Claude Daily Agent"
          git config user.email "agent@users.noreply.github.com"
          git add iran-war-impact-framework.md iran-war-standing.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily briefing $(date -u +%Y-%m-%d)"
          git push
